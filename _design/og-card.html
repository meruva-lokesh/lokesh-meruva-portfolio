<!doctype html>
<!-- Source for assets/images/lokesh/og-card.jpg (link previews). Render #card at 1200x630. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Phudu:wght@500..800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
      }
      #card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f4f4f2;
        font-family: "Instrument Sans", sans-serif;
        color: #161615;
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 96px;
        width: 540px;
      }
      h1 {
        margin: 0;
        font: 700 132px/0.86 "Phudu", sans-serif;
      }
      h1 span {
        color: #d9501a;
      }
      p {
        margin: 34px 0 0;
        font-size: 28px;
        line-height: 1.3;
        color: #3d3b37;
      }
      .url {
        position: absolute;
        left: 72px;
        bottom: 56px;
        font-size: 22px;
        font-weight: 600;
        color: #5c5a54;
      }
      .disc {
        position: absolute;
        right: -60px;
        bottom: -260px;
        width: 640px;
        height: 640px;
        border-radius: 50%;
        background: radial-gradient(circle at 42% 32%, #f0874a 0%, #d9501a 45%, #a83a0c 100%);
      }
      .me {
        position: absolute;
        right: 40px;
        bottom: 0;
        width: 430px;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="disc"></div>
      <img class="me" src="../assets/images/lokesh/hero-cutout.png" alt="" />
      <div class="copy">
        <h1>Lokesh<br />Meruva<span>.</span></h1>
        <p>AI/ML engineer building agentic AI: multi-agent pipelines, RAG and MCP tool servers.</p>
      </div>
      <div class="url">lokesh-meruva-portfolio.vercel.app</div>
    </div>
  </body>
</html>
